<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ferrari Sprint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="screen active">
      <div class="screen-inner">
        <div class="f1-badge">F1</div>
        <h1 class="game-title">FERRARI<br><span class="title-accent">SPRINT</span></h1>
        <div class="inst-box">
          <div class="inst-row"><span class="key-badge">← →</span> Arrow keys to steer</div>
          <div class="inst-row"><span class="key-badge">TAP</span> Left / Right side of screen</div>
        </div>
        <button class="btn-main" id="startBtn">TAP TO START</button>
        <div class="best-label" id="startBest"></div>
      </div>
    </div>

    <div id="gameover-screen" class="screen">
      <div class="screen-inner">
        <div class="crash-badge">CRASH!</div>
        <h2 class="go-title">RACE OVER</h2>
        <div class="score-panel">
          <div class="sp-row"><span class="sp-lbl">SCORE</span><span class="sp-val" id="finalScore">0</span></div>
          <div class="sp-row best"><span class="sp-lbl">BEST</span><span class="sp-val" id="bestScore">0</span></div>
        </div>
        <button class="btn-main" id="restartBtn">RACE AGAIN</button>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-lbl">SCORE</div>
        <div class="hud-val" id="hudScore">0</div>
      </div>
      <div class="hud-center">
        <div class="spd-val" id="hudSpeed">0</div>
        <div class="spd-unit">KM/H</div>
      </div>
      <div class="hud-right">
        <div class="hud-lbl">BEST</div>
        <div class="hud-val" id="hudBest">0</div>
      </div>
    </div>

    <div id="near-miss" class="hidden">NEAR MISS! +500</div>

    <div id="touch-left" class="touch-zone"></div>
    <div id="touch-right" class="touch-zone"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
